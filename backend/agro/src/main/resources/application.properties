spring.application.name=agro
# ============================================================
#   SPRING BOOT AGGREGATOR - APPLICATION PROPERTIES
# ============================================================

# ------------------------------------------------------------
# Server Configuration
# ------------------------------------------------------------
server.port=8080
server.error.include-message=always

# ------------------------------------------------------------
# Microservices base URLs
# ------------------------------------------------------------
services.python-ml.base-url=${PYTHON_SERVICE_URL:http://localhost:8001}
services.dotnet-recommendation.base-url=${DOTNET_SERVICE_URL:http://localhost:5226}

# ------------------------------------------------------------
# HTTP Timeout Settings
# ------------------------------------------------------------
spring.mvc.async.request-timeout=30000
spring.web.client.connect-timeout=5000
spring.web.client.read-timeout=15000

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.agro=DEBUG

# ------------------------------------------------------------
# CORS (for frontend React App)
# ------------------------------------------------------------
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ------------------------------------------------------------
# Suppress Noisy Logs
# ------------------------------------------------------------
logging.level.org.springframework.web.servlet.mvc.method.annotation.SseEmitter=ERROR
logging.level.org.apache.catalina.connector=ERROR
logging.level.io.netty=ERROR

# ------------------------------------------------------------
# Database Configuration (if applicable)
# ------------------------------------------------------------
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/agro_db}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:srikar123}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# This tells Hibernate to create/update your tables automatically
spring.jpa.hibernate.ddl-auto=update

# Show the SQL queries in the console (good for debugging)
spring.jpa.show-sql=true

# ------------------------------------------------------------
# JWT Configuration
# ------------------------------------------------------------
# JWT secret: either base64 OR hex (the code auto-detects)
jwt.secret=${JWT_SECRET:Zm9yLWRldi1vbmx5LXJlcGxhY2Utd2l0aC1hLXJlYWwtc2VjcmV0LWluLWVudi0xMjM0NTY3OA==}

# Optional: token expiry (ms)
jwt.expirationMs=3600000
app.auth.allow-open-farmer-creation=${ALLOW_OPEN_FARMER_CREATION:false}
# ============================================================
